<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>月曆｜My Planner</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --text: #121827;
      --muted: #9aa2b2;
      --primary: #7165df;
      --light: #ebe8ff;
      --red: #df6470;
      --shadow: 0 16px 36px rgba(42, 50, 75, 0.08);
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button,
    input,
    textarea {
      max-width: 100%;
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    input,
    textarea {
      min-width: 0;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      min-width: 0;
      padding: 0 12px;
      font-size: 16px;
    }

    .app {
      width: 100%;
      max-width: 820px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 20px 50px;
    }

    /* 頁首 */

    .topbar {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr) 60px;
      align-items: center;
      margin-bottom: 28px;
    }

    .topbar h1 {
      text-align: center;
      font-size: 1.7rem;
    }

    .back,
    .today,
    .nav {
      border: 0;
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .back {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      color: var(--text);
      text-decoration: none;
      font-size: 1.7rem;
    }

    .today {
      height: 42px;
      color: #574db5;
      background: var(--light);
      font-weight: 700;
    }

    /* 月份切換 */

    .monthbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .monthbar h2 {
      font-size: 1.45rem;
    }

    .month-nav {
      display: flex;
      flex-shrink: 0;
      gap: 10px;
    }

    .nav {
      width: 42px;
      height: 42px;
      color: #504b79;
      font-size: 1.35rem;
    }

    /* 月曆 */

    .calendar {
      width: 100%;
      overflow: hidden;
      padding: 24px 20px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      margin-bottom: 10px;
    }

    .weekday {
      min-width: 0;
      padding: 8px 0;
      color: #858d9d;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .weekday:first-child,
    .weekday:last-child {
      color: #ef6170;
    }

    .days {
      row-gap: 10px;
    }

    .day {
      position: relative;
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 64px;
      place-items: center;
      border: 0;
      border-radius: 16px;
      color: var(--text);
      background: transparent;
      font-weight: 700;
    }

    .day:hover {
      background: #f5f4ff;
    }

    .day.other {
      color: #c7ccd7;
    }

    .day.selected {
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 9px 20px rgba(113, 101, 223, 0.32);
    }

    .day.has-event::after {
      position: absolute;
      bottom: 7px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary);
      content: "";
    }

    .day.selected.has-event::after {
      background: #ffffff;
    }

    /* 事件區 */

    .events-section {
      margin-top: 24px;
    }

    .events-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .events-heading h2 {
      min-width: 0;
      font-size: 1.15rem;
    }

    .add {
      min-height: 44px;
      flex-shrink: 0;
      padding: 0 16px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      background: var(--primary);
      font-weight: 700;
    }

    .event-list {
      display: grid;
      gap: 12px;
    }

    .empty,
    .event {
      border-radius: 22px;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .empty {
      padding: 32px 18px;
      color: var(--muted);
      text-align: center;
    }

    .event {
      display: flex;
      align-items: stretch;
      gap: 14px;
      padding: 16px;
    }

    .event-line {
      width: 7px;
      flex-shrink: 0;
      border-radius: 10px;
      background: var(--primary);
    }

    .event-content {
      min-width: 0;
      flex: 1;
    }

    .event-time {
      margin-bottom: 5px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .event-name {
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .event-note {
      margin-top: 6px;
      color: #7d8492;
      font-size: 0.84rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    /* 編輯、刪除上下排列 */

    .actions {
      display: flex;
      flex-shrink: 0;
      flex-direction: column;
      gap: 7px;
    }

    .edit,
    .delete {
      width: 44px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .edit {
      color: #5d53bb;
      background: #efedff;
    }

    .delete {
      color: var(--red);
      background: #ffedef;
    }

    /* 新增／編輯事件視窗 */

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
      overflow-y: auto;
      background: rgba(20, 25, 38, 0.45);
      overscroll-behavior: contain;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 620px;
      max-height: calc(100dvh - 24px);
      padding: 24px;
      overflow-x: hidden;
      overflow-y: auto;
      border-radius: 26px;
      background: #ffffff;
      -webkit-overflow-scrolling: touch;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .close {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 0;
      border-radius: 12px;
      color: #4c83e7;
      background: #f1f2f6;
      font-size: 1.2rem;
    }

    .field {
      min-width: 0;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #5e6573;
      font-size: 0.84rem;
      font-weight: 700;
    }

    input,
    textarea {
      display: block;
      width: 100%;
      border: 1px solid #dfe3eb;
      border-radius: 13px;
      outline: 0;
      background: #fbfcfe;
      font-size: 16px;
    }

    input {
      height: 47px;
      padding: 0 13px;
    }

    textarea {
      min-height: 90px;
      padding: 12px 13px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(113, 101, 223, 0.12);
    }

    .form-row {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);
      gap: 12px;
    }

    .save {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 14px;
      color: #ffffff;
      background: var(--primary);
      font-size: 1rem;
      font-weight: 800;
    }

    /* 手機版 */

    @media (max-width: 520px) {
      .app {
        padding:
          max(20px, env(safe-area-inset-top))
          12px
          calc(40px + env(safe-area-inset-bottom));
      }

      .topbar {
        grid-template-columns: 44px minmax(0, 1fr) 56px;
        margin-bottom: 24px;
      }

      .topbar h1 {
        font-size: 1.45rem;
      }

      .monthbar h2 {
        font-size: 1.3rem;
      }

      .calendar {
        padding: 18px 8px;
        border-radius: 23px;
      }

      .days {
        row-gap: 5px;
      }

      .day {
        min-height: 50px;
        border-radius: 13px;
        font-size: 0.82rem;
      }

      .event {
        gap: 10px;
        padding: 14px 12px;
      }

      .actions {
        flex-direction: column;
      }

      .edit,
      .delete {
        width: 42px;
        height: 36px;
        font-size: 0.72rem;
      }

      .form-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 0;
      }

      .modal {
        max-height: calc(100dvh - 24px);
        padding: 22px 18px;
        border-radius: 24px;
      }

      input,
      textarea {
        width: 100%;
        min-width: 0;
      }
    }

    @media (max-width: 360px) {
      .events-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .add {
        width: 100%;
      }

      .calendar {
        padding-right: 5px;
        padding-left: 5px;
      }

      .day {
        min-height: 45px;
        font-size: 0.76rem;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="topbar">
      <a
        class="back"
        href="index.html"
        aria-label="回首頁"
      >
        ‹
      </a>

      <h1>月曆</h1>

      <button
        class="today"
        id="todayBtn"
        type="button"
      >
        今天
      </button>
    </header>

    <section class="monthbar">
      <h2 id="monthTitle"></h2>

      <div class="month-nav">
        <button
          class="nav"
          id="prevBtn"
          type="button"
          aria-label="上一個月"
        >
          ‹
        </button>

        <button
          class="nav"
          id="nextBtn"
          type="button"
          aria-label="下一個月"
        >
          ›
        </button>
      </div>
    </section>

    <section class="calendar">
      <div class="weekdays">
        <div class="weekday">日</div>
        <div class="weekday">一</div>
        <div class="weekday">二</div>
        <div class="weekday">三</div>
        <div class="weekday">四</div>
        <div class="weekday">五</div>
        <div class="weekday">六</div>
      </div>

      <div
        class="days"
        id="days"
      ></div>
    </section>

    <section class="events-section">
      <div class="events-heading">
        <h2 id="dateTitle"></h2>

        <button
          class="add"
          id="addBtn"
          type="button"
        >
          ＋新增事件
        </button>
      </div>

      <div
        class="event-list"
        id="eventList"
      ></div>
    </section>

  </main>

  <div
    class="overlay"
    id="overlay"
  >
    <section
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >
      <div class="modal-header">
        <h2 id="modalTitle">新增事件</h2>

        <button
          class="close"
          id="closeBtn"
          type="button"
          aria-label="關閉"
        >
          ×
        </button>
      </div>

      <form id="eventForm">
        <div class="field">
          <label for="name">事件名稱</label>

          <input
            id="name"
            type="text"
            maxlength="60"
            required
          >
        </div>

        <div class="form-row">
          <div class="field">
            <label for="date">日期</label>

            <input
              id="date"
              type="date"
              required
            >
          </div>

          <div class="field">
            <label for="time">時間</label>

            <input
              id="time"
              type="time"
            >
          </div>
        </div>

        <div class="field">
          <label for="note">備註</label>

          <textarea
            id="note"
            maxlength="300"
          ></textarea>
        </div>

        <button
          class="save"
          id="saveBtn"
          type="submit"
        >
          儲存事件
        </button>
      </form>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);

    const today = new Date();

    let viewDate = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    let selectedDate = dateKey(today);
    let editingId = null;
    let editingDate = null;

    let events;

    try {
      events = JSON.parse(
        localStorage.getItem("myPlannerEvents") || "{}"
      );
    } catch {
      events = {};
    }

    function dateKey(date) {
      const year = date.getFullYear();

      const month = String(
        date.getMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getDate()
      ).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function keyToDate(key) {
      const [year, month, day] =
        key.split("-").map(Number);

      return new Date(
        year,
        month - 1,
        day
      );
    }

    function saveEvents() {
      localStorage.setItem(
        "myPlannerEvents",
        JSON.stringify(events)
      );
    }

    function renderCalendar() {
      $("days").innerHTML = "";

      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();

      $("monthTitle").textContent =
        `${year} 年 ${month + 1} 月`;

      const firstWeekday =
        new Date(year, month, 1).getDay();

      const start =
        new Date(
          year,
          month,
          1 - firstWeekday
        );

      for (let i = 0; i < 42; i++) {
        const date = new Date(start);

        date.setDate(
          start.getDate() + i
        );

        const key = dateKey(date);

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "day";
        button.textContent = date.getDate();

        if (date.getMonth() !== month) {
          button.classList.add("other");
        }

        if (key === selectedDate) {
          button.classList.add("selected");
        }

        if (events[key]?.length) {
          button.classList.add("has-event");
        }

        button.onclick = () => {
          selectedDate = key;

          viewDate = new Date(
            date.getFullYear(),
            date.getMonth(),
            1
          );

          renderCalendar();
          renderEvents();
        };

        $("days").appendChild(button);
      }
    }

    function renderEvents() {
      const date = keyToDate(selectedDate);

      $("dateTitle").textContent =
        `${date.getMonth() + 1} 月 ${date.getDate()} 日事件`;

      const list =
        [...(events[selectedDate] || [])]
          .sort((a, b) =>
            (a.time || "99:99").localeCompare(
              b.time || "99:99"
            )
          );

      $("eventList").innerHTML = "";

      if (!list.length) {
        $("eventList").innerHTML =
          `<div class="empty">這一天目前沒有事件</div>`;

        return;
      }

      list.forEach(event => {
        const item =
          document.createElement("article");

        item.className = "event";

        item.innerHTML = `
          <div class="event-line"></div>

          <div class="event-content">
            <div class="event-time">
              ${event.time || "全天"}
            </div>

            <div class="event-name"></div>

            ${
              event.note
                ? `<p class="event-note"></p>`
                : ""
            }
          </div>

          <div class="actions">
            <button
              class="edit"
              type="button"
            >
              編輯
            </button>

            <button
              class="delete"
              type="button"
            >
              刪除
            </button>
          </div>
        `;

        item.querySelector(
          ".event-name"
        ).textContent = event.name;

        if (event.note) {
          item.querySelector(
            ".event-note"
          ).textContent = event.note;
        }

        item.querySelector(
          ".edit"
        ).onclick = () => {
          openEdit(event);
        };

        item.querySelector(
          ".delete"
        ).onclick = () => {
          if (
            !confirm("確定要刪除這個事件嗎？")
          ) {
            return;
          }

          events[selectedDate] =
            events[selectedDate].filter(
              item => item.id !== event.id
            );

          if (!events[selectedDate].length) {
            delete events[selectedDate];
          }

          saveEvents();
          renderCalendar();
          renderEvents();
        };

        $("eventList").appendChild(item);
      });
    }

    function lockPage() {
      document.body.style.overflow = "hidden";
    }

    function unlockPage() {
      document.body.style.overflow = "";
    }

    function openAdd() {
      editingId = null;
      editingDate = null;

      $("modalTitle").textContent =
        "新增事件";

      $("saveBtn").textContent =
        "儲存事件";

      $("name").value = "";
      $("date").value = selectedDate;
      $("time").value = "";
      $("note").value = "";

      $("overlay").classList.add("show");

      lockPage();

      setTimeout(() => {
        $("name").focus();
      }, 100);
    }

    function openEdit(event) {
      editingId = event.id;
      editingDate = selectedDate;

      $("modalTitle").textContent =
        "編輯事件";

      $("saveBtn").textContent =
        "更新事件";

      $("name").value =
        event.name;

      $("date").value =
        selectedDate;

      $("time").value =
        event.time || "";

      $("note").value =
        event.note || "";

      $("overlay").classList.add("show");

      lockPage();

      setTimeout(() => {
        $("name").focus();
      }, 100);
    }

    function closeModal() {
      $("overlay").classList.remove("show");
      unlockPage();
    }

    $("eventForm").onsubmit = event => {
      event.preventDefault();

      const name =
        $("name").value.trim();

      const newDate =
        $("date").value;

      const time =
        $("time").value;

      const note =
        $("note").value.trim();

      if (!name || !newDate) {
        return;
      }

      if (editingId) {
        events[editingDate] =
          (events[editingDate] || []).filter(
            event => event.id !== editingId
          );

        if (!events[editingDate].length) {
          delete events[editingDate];
        }
      }

      if (!events[newDate]) {
        events[newDate] = [];
      }

      events[newDate].push({
        id:
          editingId ||
          `${Date.now()}-${Math.random()}`,
        name,
        time,
        note
      });

      selectedDate = newDate;

      const date =
        keyToDate(newDate);

      viewDate = new Date(
        date.getFullYear(),
        date.getMonth(),
        1
      );

      saveEvents();
      closeModal();
      renderCalendar();
      renderEvents();
    };

    $("prevBtn").onclick = () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() - 1,
        1
      );

      renderCalendar();
    };

    $("nextBtn").onclick = () => {
      viewDate = new Date(
        viewDate.getFullYear(),
        viewDate.getMonth() + 1,
        1
      );

      renderCalendar();
    };

    $("todayBtn").onclick = () => {
      selectedDate =
        dateKey(today);

      viewDate = new Date(
        today.getFullYear(),
        today.getMonth(),
        1
      );

      renderCalendar();
      renderEvents();
    };

    $("addBtn").onclick =
      openAdd;

    $("closeBtn").onclick =
      closeModal;

    $("overlay").onclick = event => {
      if (event.target === $("overlay")) {
        closeModal();
      }
    };

    document.addEventListener(
      "keydown",
      event => {
        if (event.key === "Escape") {
          closeModal();
        }
      }
    );

    renderCalendar();
    renderEvents();
  </script>
</body>
</html>
