<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;
            color: #202838;
            background: linear-gradient(
                180deg,
                #fbfcff 0%,
                #f5f7fa 100%
            );
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .app {
            width: 100%;
            max-width: 760px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 52px 24px 40px;
        }

        /* 頁首 */

        .header {
            margin-bottom: 34px;
        }

        .header-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
        }

        .title {
            font-size: clamp(2.4rem, 9vw, 4.2rem);
            line-height: 1;
            letter-spacing: -2px;
        }

        .date-box {
            flex-shrink: 0;
            padding-top: 6px;
            color: #5e6776;
            text-align: right;
        }

        .date {
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .weekday {
            margin-top: 8px;
            font-size: 0.95rem;
        }

        /* 六格功能區 */

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .menu-card {
            position: relative;
            display: flex;
            min-height: 190px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 24px 20px;
            border: 1px solid rgba(50, 60, 80, 0.08);
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(44, 55, 78, 0.06);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 38px rgba(44, 55, 78, 0.1);
        }

        .menu-card:active {
            transform: scale(0.98);
        }

        .icon-wrap {
            display: flex;
            width: 78px;
            height: 78px;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border-radius: 50%;
            font-size: 2.3rem;
        }

        .menu-card h2 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .arrow {
            position: absolute;
            right: 20px;
            bottom: 16px;
            color: #606978;
            font-size: 1.7rem;
            line-height: 1;
        }

        /* 卡片顏色 */

        .calendar-card {
            background: #faf8ff;
        }

        .calendar-card .icon-wrap {
            background: #eee9ff;
        }

        .month-card {
            background: #f5fbf8;
        }

        .month-card .icon-wrap {
            background: #e3f4eb;
        }

        .todo-card {
            background: #fff8f5;
        }

        .todo-card .icon-wrap {
            background: #ffe9e1;
        }

        .today-card {
            background: #f5faff;
        }

        .today-card .icon-wrap {
            background: #e2f0ff;
        }

        .study-card {
            background: #fffbf0;
        }

        .study-card .icon-wrap {
            background: #fff1bf;
        }

        .graduate-card {
            background: #f8f7ff;
        }

        .graduate-card .icon-wrap {
            background: #ebe8ff;
        }

        /* 手機版 */

        @media (max-width: 520px) {
            .app {
                padding: 36px 16px 28px;
            }

            .header {
                margin-bottom: 26px;
            }

            .header-top {
                align-items: flex-end;
            }

            .title {
                font-size: 2.7rem;
                letter-spacing: -1px;
            }

            .date,
            .weekday {
                font-size: 0.78rem;
            }

            .menu-grid {
                gap: 12px;
            }

            .menu-card {
                min-height: 165px;
                padding: 20px 12px;
                border-radius: 22px;
            }

            .icon-wrap {
                width: 66px;
                height: 66px;
                margin-bottom: 14px;
                font-size: 1.9rem;
            }

            .menu-card h2 {
                font-size: 1.08rem;
            }

            .arrow {
                right: 14px;
                bottom: 11px;
                font-size: 1.35rem;
            }
        }

        @media (max-width: 360px) {
            .app {
                padding-right: 12px;
                padding-left: 12px;
            }

            .title {
                font-size: 2.2rem;
            }

            .menu-card {
                min-height: 150px;
            }

            .icon-wrap {
                width: 58px;
                height: 58px;
                font-size: 1.7rem;
            }

            .menu-card h2 {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <main class="app">

        <header class="header">
            <div class="header-top">

                <h1 class="title">My Planner</h1>

                <div class="date-box">
                    <div class="date" id="currentDate"></div>
                    <div class="weekday" id="currentWeekday"></div>
                </div>

            </div>
        </header>

        <section class="menu-grid">

            <!-- 左上：月曆 -->
            <a
                class="menu-card calendar-card"
                href="calendar.html"
                aria-label="前往月曆"
            >
                <div class="icon-wrap">📅</div>
                <h2>月曆</h2>
                <span class="arrow">›</span>
            </a>

            <!-- 右上：月規劃 -->
            <a
                class="menu-card month-card"
                href="month-plan.html"
                aria-label="前往月規劃"
            >
                <div class="icon-wrap">📋</div>
                <h2>月規劃</h2>
                <span class="arrow">›</span>
            </a>

            <!-- 左中：To Do List -->
            <a
                class="menu-card todo-card"
                href="todo.html"
                aria-label="前往待辦事項"
            >
                <div class="icon-wrap">✅</div>
                <h2>To Do List</h2>
                <span class="arrow">›</span>
            </a>

            <!-- 右中：今日行程 -->
            <a
                class="menu-card today-card"
                href="schedule.html"
                aria-label="前往今日行程"
            >
                <div class="icon-wrap">🕒</div>
                <h2>今日行程</h2>
                <span class="arrow">›</span>
            </a>

            <!-- 左下：讀書規劃 -->
            <a
                class="menu-card study-card"
                href="study-plan.html"
                aria-label="前往讀書規劃"
            >
                <div class="icon-wrap">📖</div>
                <h2>讀書規劃</h2>
                <span class="arrow">›</span>
            </a>

            <!-- 右下：研究所進度 -->
            <a
                class="menu-card graduate-card"
                href="graduate-progress.html"
                aria-label="前往研究所進度"
            >
                <div class="icon-wrap">🎓</div>
                <h2>研究所進度</h2>
                <span class="arrow">›</span>
            </a>

        </section>
    </main>

    <script>
        const now = new Date();

        const dateFormatter = new Intl.DateTimeFormat("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit"
        });

        const weekdayFormatter = new Intl.DateTimeFormat("zh-TW", {
            weekday: "long"
        });

        document.getElementById("currentDate").textContent =
            dateFormatter.format(now);

        document.getElementById("currentWeekday").textContent =
            weekdayFormatter.format(now);
    </script>
</body>
</html>
